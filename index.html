<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IST Time Converter</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 340px;
      padding: 16px;
      margin: 0;
      background-color: #f8f9fa;
      color: #212529;
    }
    h3 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 12px;
      color: #0d6efd;
    }
    .toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #e9ecef;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .direction-text {
      font-size: 13px;
      font-weight: 700;
      color: #495057;
    }
    .swap-btn {
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .swap-btn:hover {
      background-color: #0b5ed7;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    select, input, button.convert-btn {
      width: 100%;
      padding: 9px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button.convert-btn {
      background-color: #198754;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-top: 15px;
      transition: background-color 0.2s;
    }
    button.convert-btn:hover {
      background-color: #157347;
    }
    .result {
      margin-top: 15px;
      padding: 12px;
      background-color: #e9ecef;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      text-align: center;
      word-wrap: break-word;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <h3>Global Time Converter</h3>

  <div class="toggle-bar">
    <span class="direction-text" id="directionLabel">IST ➔ Foreign Timezone</span>
    <button class="swap-btn" id="swapBtn">⇄ Toggle</button>
  </div>

  <label for="timeInput" id="inputLabel">Enter Time in IST:</label>
  <input type="datetime-local" id="timeInput">

  <label for="targetTimezone" id="tzLabel">Select Foreign Timezone:</label>
  <select id="targetTimezone">
    <option value="America/New_York">New York (Eastern Time)</option>
    <option value="America/Los_Angeles">Los Angeles (Pacific Time)</option>
    <option value="Europe/London">London (GMT/BST)</option>
    <option value="Europe/Paris">Paris (CET/CEST)</option>
    <option value="Europe/Berlin">Berlin (CET/CEST)</option>
    <option value="Asia/Dubai">Dubai (Gulf Standard Time)</option>
    <option value="Asia/Riyadh">Riyadh (Arabian Standard Time)</option>
    <option value="Asia/Jerusalem">Jerusalem (IST/IDT)</option>
    <option value="Asia/Tokyo">Tokyo (JST)</option>
    <option value="Asia/Singapore">Singapore (SGT)</option>
    <option value="Australia/Sydney">Sydney (AEST/AEDT)</option>
    <option value="UTC">Coordinated Universal Time (UTC)</option>
  </select>

  <button class="convert-btn" id="convertBtn">Convert Time</button>

  <div class="result" id="result">Result will appear here</div>

  <script src="popup.js"></script>
</body>
</html>
